<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Connections</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Връзки</h1>
    <h2>New York Times Connections</h2>
    <p class="text">Направи четири групи от четири думи!</p>
	<div id="game-grid">
    </div>
    <div class="mistakes-container">
        <label class="mistakes-label">Оставащи грешки:</label>
        <div class="mistake-dot" id="md4"></div>
        <div class="mistake-dot" id="md3"></div>
        <div class="mistake-dot" id="md2"></div>
        <div class="mistake-dot" id="md1"></div>
    </div>
    <div class="buttons-container">
        <button id="shuffle" class="game-btn">Разбъркай</button>
        <button id="deselect" disabled class="game-btn">Деселeктирай всички</button>
        <button id="submit" disabled class="game-btn">Провери</button>
    </div>
</body>
</html>
